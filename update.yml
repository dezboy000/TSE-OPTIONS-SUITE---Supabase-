name: TSE Options Daily Update

# زمان‌بندی جدید:
# ۱. هر روز شنبه تا چهارشنبه ساعت ۱۴:۳۰ UTC (معادل ۱۸:۰۰ تهران)
# ۲. هر روز شنبه تا چهارشنبه ساعت ۱۹:۳۰ UTC (معادل ۲۳:۰۰ تهران)
on:
  schedule:
    - cron: '30 14 * * 1-5' # ۶ عصر به وقت ایران
    - cron: '30 19 * * 1-5' # ۱۱ شب به وقت ایران
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدهای شما از مخزن
      - name: Checkout code
        uses: actions/checkout@v4

      # ۲. نصب پایتون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ۳. نصب کتابخانه‌های مورد نیاز
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ۴. اجرای اسکریپت پایتون با استفاده از کلیدهای مخفی
      - name: Run Python Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

      # ۵. ذخیره فایل JSON به‌روزشده در گیت‌هاب
      - name: Commit updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TSE_Options_Latest.json
          git commit -m "chore: auto-update TSE options data" || echo "No changes to commit"
          git push
